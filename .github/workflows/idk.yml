# This is a basic workflow to try to build https://github.com/salvogiangri/UN1CA under Github Actions

name: "Build UN1CA under Github Actions"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        required: true
        default: "a23"
      debug_build:
        description: "Debug build"
        required: true
        default: false
        type: boolean
      notify_telegram_bot:
        description: "Notify using telegram bot (Make sure you set up the secrets with variables: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: "Build UN1CA"
    runs-on: ubuntu-24.04
    steps:
        - name: "Checkout"
          uses: actions/checkout@v7
          
        - name: "Free disk space (1/3)"
          run: |
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force
            sudo docker builder prune -a

        - name: "Free disk space (2/3)"
          uses: jlumbroso/free-disk-space@main
          with:
            tool-cache: true

        - name: "Free disk space (3/3)"
          uses: rokibhasansagar/slimhub_actions@main
          with:
            retain: 'compiler_cmake'

        - name: "Set up dependencies"
          run: |
            sudo apt update
            sudo apt upgrade -y
            DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
              7zip attr ccache clang ffmpeg \
              libbrotli-dev libbz2-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
              libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp openjdk-17-jdk
            sudo modprobe erofs f2fs

        - name: "Clone forked repo"
          run: |
            git clone --recurse-submodules -b ${{ github.event.inputs.device }} --single-branch  https://github.com/qwertswa/ArtisanROM UN1CA
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        - name: "Build it!"
          run: |
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            cd UN1CA
            if [[ "${{ github.event.inputs.debug_build }}" = "true" ]]; then
            source buildenv.sh --debug ${{ github.event.inputs.device }}
            else
            source buildenv.sh ${{ github.event.inputs.device }}
            fi
            run_cmd make_rom --build-rom-zip
            cd ..
          continue-on-error: true

        - name: "Pull Finished ROM"
          run: |
            mkdir out
            echo "Checking before copying to out directory"
            ls UN1CA/out
            cp UN1CA/out/*.zip out

        - name: "Upload flasheable zip to Github Artifact"
          uses: actions/upload-artifact@v7
          with:
            path: out/UN1CA_*${{ github.event.inputs.device }}*.zip
            archive: false
            continue-on-error: true

        - name: "Upload target_files.zip to Github Artifact"
          uses: actions/upload-artifact@v7
          with:
            path: out/${{ github.event.inputs.device }}_*-target_files.zip
            archive: false

        - name: "Notify Telegram Channel"
          if: ${{ github.event.inputs.notify_telegram_bot == 'true' }}
          uses: appleboy/telegram-action@master
          with:
            to: ${{ secrets.TELEGRAM_CHAT_ID }}
            token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            message: |
              UN1CA has been built sucessfully
              Action ID: ${{ github.run_id }}
              Device: ${{ github.event.inputs.device }}
     
